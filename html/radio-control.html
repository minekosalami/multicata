<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radio Control Panel · Multi-Cata</title>
<link rel="stylesheet" href="../css/site.css"><link rel="stylesheet" href="../css/renaissance.css"><link rel="stylesheet" href="../css/radio.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/backend.js"></script>
<script src="../js/site.js" defer></script><script src="../js/player.js" defer></script>
<script src="../js/social.js"></script><script src="../js/music.js?v=audio-50mb"></script>
<script type="module" src="../js/radio-control.js"></script></head>
<body class="radio-page"><header class="site-header"><a class="site-brand" href="index.html">Multi-Cata</a>
<nav class="site-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="articles.html">Articles</a><a href="posts.html">Posts</a><a href="chat.html">Chat</a><a href="account.html">Account</a></nav></header>
<main class="radio-layout"><h1>Radio Control Panel</h1><a href="radio.html">Listen to mCata Radio</a>
<p id="panel-status" role="status">Checking access…</p><div id="controls" hidden>
<section class="radio-card"><h2>Current broadcast</h2><p class="radio-screen" id="current"></p>
<label>DJ mode <select id="mode"><option value="auto">Automatic</option><option value="manual">Manual DJ</option></select></label>
<button id="skip">Skip current broadcast</button></section>
<section class="radio-card lavender"><h2>Radio Music Library</h2><p id="summary"></p>
<label>Search music <input type="search" id="search"></label><ul id="catalog"></ul></section>
<section class="radio-card lavender"><h2>Announcements</h2>
<label>Announcement title <input id="announcement-title" maxlength="150"></label>
<label>Upload audio <input type="file" id="upload" accept=".wav,.flac,.mp3,.ogg,.oga,.opus,.m4a,.webm"></label>
<button id="record">Record audio</button><button id="stop" disabled>Stop recording</button>
<div class="radio-screen"><span id="record-time">Microphone off</span><meter id="level" min="0" max="1" value="0" aria-label="Microphone level"></meter></div>
<audio id="preview" controls hidden></audio><p id="file-info"></p><button id="save" disabled>Save announcement</button></section>
<section class="radio-card yellow"><h2>Broadcast timing</h2><form id="schedule">
<label>Recording <select id="asset" required></select></label>
<fieldset><legend>Broadcast timing</legend><label><input type="radio" name="period" value="instant" checked> Instant</label>
<label><input type="radio" name="period" value="schedule"> Schedule</label></fieldset>
<fieldset id="instant"><legend>Start playback</legend><label><input type="radio" name="instantTiming" value="now"> Play now</label>
<label><input type="radio" name="instantTiming" value="next" checked> After current song</label></fieldset>
<fieldset id="later" hidden><legend>Scheduled start</legend><label>Date and time (local) <input type="datetime-local" id="due"></label>
<label><input type="radio" name="scheduleTiming" value="exact" checked> Play at exact time</label>
<label><input type="radio" name="scheduleTiming" value="after"> After song ends</label></fieldset>
<button>Queue broadcast</button></form></section>
<section class="radio-card blue"><h2>Upcoming queue</h2><button id="append">Add selected recording to end</button><ol id="queue"></ol></section>
</div></main></body></html>
