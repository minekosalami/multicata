<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Multi-Cata Profile</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        /* TOP BAR */

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: #222;
        }

        .site-name {
            font-size: 24px;
            font-weight: bold;
        }

        .top-buttons {
            display: flex;
            gap: 10px;
        }

        .top-button {
            color: white;
            text-decoration: none;
            background: #333;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .top-button:hover {
            background: #555;
        }


        /* PROFILE */

        .profile-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
        }

        .profile-card {
            background: #1c1c1c;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
        }

        .profile-picture {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            background: #333;
            margin-bottom: 20px;
        }

        .username {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .display-name {
            font-size: 20px;
            color: #ccc;
            margin-bottom: 20px;
        }

        .bio {
            font-size: 16px;
            color: #ddd;
            margin: 20px auto;
            max-width: 600px;
            white-space: pre-wrap;
        }

        .member-since {
            margin-top: 25px;
            color: #888;
            font-size: 14px;
        }

        .error {
            text-align: center;
            color: #ff7777;
            font-size: 20px;
            padding: 50px;
        }

        .loading {
            text-align: center;
            color: #aaa;
            font-size: 20px;
            padding: 50px;
        }

    </style>

</head>


<body>

    <!-- TOP BAR -->

    <header class="top-bar">

        <div class="site-name">
            Multi-Cata
        </div>

        <div class="top-buttons">

            <a href="chat.html" class="top-button">
                New - CHAT
            </a>

            <a href="account.html" class="top-button">
                Account
            </a>

        </div>

    </header>


    <!-- PROFILE -->

    <main class="profile-container">

        <div id="profileArea" class="loading">
            Loading profile...
        </div>

    </main>


<script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL = "https://ncmizvdipzjwiknslohn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_l2Bi2NHypj5wHzOqE2U_nw_CFXaF1T-";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    // ==========================================
    // GET USERNAME FROM URL
    // ==========================================

    const params =
        new URLSearchParams(
            window.location.search
        );


    const username =
        params.get("user");


    // ==========================================
    // LOAD PROFILE
    // ==========================================

    async function loadProfile() {

        const profileArea =
            document.getElementById("profileArea");


        if (!username) {

            profileArea.className = "error";

            profileArea.textContent =
                "No username was provided.";

            return;

        }


        const { data, error } =
            await supabaseClient
                .from("profiles")
                .select(
                    "username, display_name, bio, profile_picture, created_at"
                )
                .eq("username", username)
                .maybeSingle();


        if (error) {

            console.error(error);

            profileArea.className = "error";

            profileArea.textContent =
                "Could not load this profile.";

            return;

        }


        if (!data) {

            profileArea.className = "error";

            profileArea.textContent =
                "Profile not found.";

            return;

        }


        // ==========================================
        // PROFILE PICTURE
        // ==========================================

        let pictureHTML = "";


        if (data.profile_picture) {

            pictureHTML = `
                <img
                    src="${data.profile_picture}"
                    class="profile-picture"
                    alt="Profile picture"
                >
            `;

        } else {

            pictureHTML = `
                <div
                    class="profile-picture"
                    style="
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-size:50px;
                    "
                >
                    👤
                </div>
            `;

        }


        // ==========================================
        // DISPLAY NAME
        // ==========================================

        const displayName =
            data.display_name || "";


        // ==========================================
        // BIO
        // ==========================================

        const bio =
            data.bio || "No bio yet.";


        // ==========================================
        // MEMBER SINCE
        // ==========================================

        let memberSince =
            "Unknown";


        if (data.created_at) {

            memberSince =
                new Date(data.created_at)
                    .toLocaleDateString(
                        undefined,
                        {
                            year: "numeric",
                            month: "long",
                            day: "numeric"
                        }
                    );

        }


        // ==========================================
        // BUILD PROFILE
        // ==========================================

        profileArea.className =
            "profile-card";


        profileArea.innerHTML = `

            ${pictureHTML}

            <div class="username">
                @${escapeHTML(data.username)}
            </div>

            ${
                displayName
                ? `
                    <div class="display-name">
                        ${escapeHTML(displayName)}
                    </div>
                  `
                : ""
            }

            <div class="bio">
                ${escapeHTML(bio)}
            </div>

            <div class="member-since">
                🗓️ Member since ${memberSince}
            </div>

        `;

    }


    // ==========================================
    // HTML ESCAPE
    // ==========================================

    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


    // ==========================================
    // START
    // ==========================================

    loadProfile();

</script>

</body>

</html>
