<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Multi-Cata Chat</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: #1b1b1b;
        }

        .site-name {
            font-size: 24px;
            font-weight: bold;
        }

        .account-button {
            color: white;
            text-decoration: none;
            background: #333;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .chat-container {
            max-width: 900px;
            height: calc(100vh - 80px);
            margin: auto;
            display: flex;
            flex-direction: column;
        }

        .chat-title {
            padding: 20px;
            text-align: center;
            font-size: 28px;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #181818;
            border-radius: 12px 12px 0 0;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px 14px;
            background: #252525;
            border-radius: 10px;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .message-avatar,
        .message-avatar-fallback {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .message-avatar {
            object-fit: cover;
            background: #333;
        }

        .message-avatar-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #333;
            color: white;
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
        }

        .username {
            font-weight: bold;
        }

        .message-text {
            word-wrap: break-word;
        }

        .message-time {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: #1b1b1b;
        }

        #messageInput {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            background: #333;
            color: white;
        }

        #sendButton {
            padding: 13px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        #sendButton:hover {
            opacity: 0.85;
        }

        #status {
            text-align: center;
            padding: 10px;
            color: #aaa;
        }

    </style>

</head>


<body>

    <header class="top-bar">

        <div class="site-name">
            Multi-Cata
        </div>

        <a href="account.html" class="account-button" id="accountButton">
            Account
        </a>

    </header>


    <div class="chat-container">

        <div class="chat-title">
            Multi-Cata Chat
        </div>

        <div id="status">
            Connecting...
        </div>

        <div id="messages"></div>

        <div class="input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                maxlength="500"
                autocomplete="off"
            >

            <button id="sendButton">
                Send
            </button>

        </div>

    </div>


<script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL = "https://ncmizvdipzjwiknslohn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_l2Bi2NHypj5wHzOqE2U_nw_CFXaF1T-";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    let currentUser = null;


    // ==========================================
    // GET CURRENT USER
    // ==========================================

    async function getCurrentUser() {

        const {
            data: { user }
        } = await supabaseClient.auth.getUser();


        if (!user) {

            document.getElementById("status").textContent =
                "You must be logged in to use chat.";

            document.getElementById("messageInput").disabled = true;

            document.getElementById("sendButton").disabled = true;

            return false;

        }


        currentUser = user;

        return true;

    }


    // ==========================================
    // LOAD MESSAGES
    // ==========================================

    async function loadMessages() {

        const { data, error } =
            await supabaseClient
                .from("messages")
                .select("*")
                .order("created_at", {
                    ascending: true
                });


        if (error) {

            console.error(error);

            document.getElementById("status").textContent =
                "Could not load messages.";

            return;

        }


        document.getElementById("messages").innerHTML = "";


        for (const message of data) {

            await displayMessage(message);

        }


        scrollToBottom();

    }


    // ==========================================
    // GET PROFILE
    // ==========================================

    async function getProfile(userId) {

        const { data, error } =
            await supabaseClient
                .from("profiles")
                .select("username, profile_picture")
                .eq("user_id", userId)
                .maybeSingle();


        if (error || !data) {

            return {
                username: "Unknown User",
                profile_picture: null
            };

        }


        return {
            username: data.username || "Unknown User",
            profile_picture: data.profile_picture || null
        };

    }


    // ==========================================
    // DISPLAY MESSAGE
    // ==========================================

    async function displayMessage(message) {

        const profile =
            await getProfile(message.user_id);


        const messageElement =
            document.createElement("div");

        messageElement.className = "message";


        const headerElement =
            document.createElement("div");

        headerElement.className = "message-header";


        let avatarElement;


        if (profile.profile_picture) {

            avatarElement =
                document.createElement("img");

            avatarElement.className =
                "message-avatar";

            avatarElement.src =
                profile.profile_picture;

            avatarElement.alt =
                profile.username + " profile picture";

            avatarElement.onerror =
                function() {

                    const fallback =
                        document.createElement("div");

                    fallback.className =
                        "message-avatar-fallback";

                    fallback.textContent =
                        profile.username.charAt(0) || "?";

                    avatarElement.replaceWith(fallback);

                };

        } else {

            avatarElement =
                document.createElement("div");

            avatarElement.className =
                "message-avatar-fallback";

            avatarElement.textContent =
                profile.username.charAt(0) || "?";

        }


        const usernameElement =
            document.createElement("div");

        usernameElement.className = "username";

        usernameElement.textContent =
            "@" + profile.username;


        headerElement.appendChild(avatarElement);
        headerElement.appendChild(usernameElement);


        const textElement =
            document.createElement("div");

        textElement.className = "message-text";

        textElement.textContent =
            message.message;


        const timeElement =
            document.createElement("div");

        timeElement.className = "message-time";

        timeElement.textContent =
            new Date(message.created_at)
                .toLocaleString();


        messageElement.appendChild(headerElement);

        messageElement.appendChild(textElement);

        messageElement.appendChild(timeElement);


        document
            .getElementById("messages")
            .appendChild(messageElement);

    }


    // ==========================================
    // SEND MESSAGE
    // ==========================================

    async function sendMessage() {

        const input =
            document.getElementById("messageInput");


        const message =
            input.value.trim();


        if (!message) {
            return;
        }


        if (!currentUser) {
            return;
        }


        const { error } =
            await supabaseClient
                .from("messages")
                .insert({

                    user_id: currentUser.id,

                    message: message

                });


        if (error) {

            console.error(error);

            alert(
                "Could not send message: " +
                error.message
            );

            return;

        }


        input.value = "";

        input.focus();

    }


    // ==========================================
    // REALTIME
    // ==========================================

    function setupRealtime() {

        supabaseClient
            .channel("chat-room")

            .on(
                "postgres_changes",

                {
                    event: "INSERT",

                    schema: "public",

                    table: "messages"
                },

                async (payload) => {

                    await displayMessage(
                        payload.new
                    );

                    scrollToBottom();

                }

            )

            .subscribe();

    }


    // ==========================================
    // SCROLL TO BOTTOM
    // ==========================================

    function scrollToBottom() {

        const messages =
            document.getElementById("messages");


        messages.scrollTop =
            messages.scrollHeight;

    }


    // ==========================================
    // SEND BUTTON
    // ==========================================

    document
        .getElementById("sendButton")
        .addEventListener(
            "click",
            sendMessage
        );


    // ==========================================
    // ENTER KEY
    // ==========================================

    document
        .getElementById("messageInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


    // ==========================================
    // START
    // ==========================================

    async function startChat() {

        const loggedIn =
            await getCurrentUser();


        if (!loggedIn) {
            return;
        }


        document.getElementById("status").textContent =
            "Online";


        await loadMessages();


        setupRealtime();

    }


    startChat();

</script>

</body>
</html>
