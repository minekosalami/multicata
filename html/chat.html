<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Multi-Cata Chat</title>

    <link rel="stylesheet" href="../css/site.css">
    <script src="../js/site.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .chat-container {
            max-width: 900px;
            height: calc(100vh - 72px);
            margin: auto;
            display: flex;
            flex-direction: column;
            padding: 0 16px;
        }

        .chat-title {
            padding: 20px;
            text-align: center;
            font-size: 28px;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #181818;
            border-radius: 12px 12px 0 0;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px 14px;
            background: #252525;
            border-radius: 10px;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .message-avatar,
        .message-avatar-fallback {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .message-avatar {
            object-fit: cover;
            background: #333;
        }

        .message-avatar-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #333;
            color: white;
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
        }

        .username {
            font-weight: bold;
            color: white;
            text-decoration: none;
        }

        a.username:hover {
            text-decoration: underline;
        }

        .message-text {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message-time {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: #1b1b1b;
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            min-height: 46px;
            max-height: 140px;
            padding: 13px;
            border: 1px solid #555;
            border-radius: 8px;
            font-size: 16px;
            background: #333;
            color: white;
            font: inherit;
            resize: vertical;
        }

        #sendButton {
            padding: 13px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        #sendButton:hover {
            opacity: 0.85;
        }

        #status {
            text-align: center;
            padding: 10px;
            color: #aaa;
        }

        #messages[data-empty="true"]::before {
            display: block;
            padding: 24px 12px;
            color: #aaa;
            text-align: center;
            content: "No messages yet. Start the conversation.";
        }

        @media (max-width: 600px) {
            .chat-container {
                height: calc(100dvh - 128px);
                min-height: 340px;
                padding: 0 10px;
            }

            .chat-title {
                padding: 14px 8px;
                font-size: 23px;
            }

            #messages {
                padding: 12px 9px;
            }

            .input-area {
                gap: 8px;
                padding: 10px 4px;
            }

            #sendButton {
                padding: 12px 14px;
            }
        }

    </style>

</head>


<body>

    <header class="site-header">
        <a class="site-brand" href="../index.html">Multi-Cata</a>
        <a class="back-button" data-back-button href="index.html">Back</a>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="posts.html">Posts</a>
            <a href="chat.html" aria-current="page">Chat</a>
            <a href="account.html" id="accountButton">Account</a>
        </nav>
    </header>


    <div class="chat-container">

        <div class="chat-title">
            Multi-Cata Chat
        </div>

        <div id="status" role="status" aria-live="polite">
            Connecting...
        </div>

        <div id="messages" data-empty="false"></div>

        <div class="input-area">

            <label for="messageInput" class="visually-hidden">Message</label>
            <textarea
                id="messageInput"
                placeholder="Type a message..."
                maxlength="500"
                autocomplete="off"
                rows="1"
                aria-describedby="status"
            ></textarea>

            <button id="sendButton">
                Send
            </button>

        </div>

    </div>


<script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL = "https://ncmizvdipzjwiknslohn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_l2Bi2NHypj5wHzOqE2U_nw_CFXaF1T-";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    let currentUser = null;


    // ==========================================
    // GET CURRENT USER
    // ==========================================

    async function getCurrentUser() {

        let user;

        try {
            const result = await supabaseClient.auth.getUser();
            if (result.error) {
                if ((result.error.message || "").toLowerCase().includes("auth session missing")) {
                    user = null;
                } else {
                    throw result.error;
                }
            } else {
                user = result.data.user;
            }
        } catch (error) {
            if (!(error.message || "").toLowerCase().includes("auth session missing")) {
                throw error;
            }
        }


        if (!user) {

            document.getElementById("status").textContent =
                "You must be logged in to use chat.";
            document.getElementById("accountButton").textContent =
                "Sign In";

            document.getElementById("messageInput").disabled = true;

            document.getElementById("sendButton").disabled = true;

            return false;

        }


        currentUser = user;
        const profile = await getProfile(user.id);
        if (profile.username !== "Unknown User") {
            document.getElementById("accountButton").textContent =
                "@" + profile.username;
        }

        return true;

    }


    // ==========================================
    // LOAD MESSAGES
    // ==========================================

    async function loadMessages() {

        const { data, error } =
            await supabaseClient
                .from("messages")
                .select("*")
                .order("created_at", {
                    ascending: true
                });


        if (error) {

            console.error(error);

            document.getElementById("status").textContent =
                "Could not load messages.";

            return;

        }


        const messagesContainer = document.getElementById("messages");
        messagesContainer.replaceChildren();

        if (!data || data.length === 0) {
        messagesContainer.dataset.empty = "true";
        document.getElementById("status").textContent =
            "No messages yet. Start the conversation.";
        return;
        }

        messagesContainer.dataset.empty = "false";
        document.getElementById("status").textContent = "Online";


        for (const message of data) {

            await displayMessage(message);

        }


        scrollToBottom();

    }


    // ==========================================
    // GET PROFILE
    // ==========================================

    async function getProfile(userId) {

        const { data, error } =
            await supabaseClient
                .from("profiles")
                .select("username, profile_picture")
                .eq("user_id", userId)
                .maybeSingle();


        if (error) {
            console.error("Could not load chat profile:", error);
        }

        if (error || !data) {

            return {
                username: "Unknown User",
                profile_picture: null
            };

        }


        return {
            username: data.username || "Unknown User",
            profile_picture: data.profile_picture || null
        };

    }


    // ==========================================
    // DISPLAY MESSAGE
    // ==========================================

    async function displayMessage(message) {

        const profile =
            await getProfile(message.user_id);


        const messageElement =
            document.createElement("div");

        messageElement.className = "message";


        const headerElement =
            document.createElement("div");

        headerElement.className = "message-header";


        let avatarElement;


        if (profile.profile_picture) {

            avatarElement =
                document.createElement("img");

            avatarElement.className =
                "message-avatar";

            avatarElement.src =
                profile.profile_picture;

            avatarElement.alt =
                profile.username + " profile picture";

            avatarElement.onerror =
                function() {

                    const fallback =
                        document.createElement("div");

                    fallback.className =
                        "message-avatar-fallback";

                    fallback.textContent =
                        profile.username.charAt(0) || "?";

                    avatarElement.replaceWith(fallback);

                };

        } else {

            avatarElement =
                document.createElement("div");

            avatarElement.className =
                "message-avatar-fallback";

            avatarElement.textContent =
                profile.username.charAt(0) || "?";

        }


        const hasProfile = profile.username !== "Unknown User";
        const usernameElement =
            document.createElement(hasProfile ? "a" : "span");

        usernameElement.className = "username";

        usernameElement.textContent =
            "@" + profile.username;

        if (hasProfile) {
            usernameElement.href =
                "profile.html?user=" + encodeURIComponent(profile.username);
        }

        if (hasProfile) {
            const profileLink = document.createElement("a");
            profileLink.href =
                "profile.html?user=" + encodeURIComponent(profile.username);
            profileLink.setAttribute("aria-label", "View @" + profile.username + "'s profile");
            profileLink.appendChild(avatarElement);
            headerElement.appendChild(profileLink);
        } else {
            headerElement.appendChild(avatarElement);
        }

        headerElement.appendChild(usernameElement);


        const textElement =
            document.createElement("div");

        textElement.className = "message-text";

        textElement.textContent =
            message.message;


        const timeElement =
            document.createElement("div");

        timeElement.className = "message-time";

        timeElement.textContent =
            new Date(message.created_at)
                .toLocaleString();


        messageElement.appendChild(headerElement);

        messageElement.appendChild(textElement);

        messageElement.appendChild(timeElement);


        document
            .getElementById("messages")
            .appendChild(messageElement);
        document.getElementById("messages").dataset.empty = "false";

    }


    // ==========================================
    // SEND MESSAGE
    // ==========================================

    async function sendMessage() {

        const input =
            document.getElementById("messageInput");


        const message =
            input.value.trim();


        if (!message) {
            return;
        }


        if (!currentUser) {
            document.getElementById("status").textContent =
                "Sign in to send a message.";
            return;
        }

        const sendButton = document.getElementById("sendButton");
        sendButton.disabled = true;

        try {
            const { error } =
                await supabaseClient
                    .from("messages")
                    .insert({

                        user_id: currentUser.id,

                        message: message

                    });

            if (error) {

                console.error(error);

                document.getElementById("status").textContent =
                    "Your message could not be sent. Please try again.";

                return;

            }

            input.value = "";
            input.focus();
            document.getElementById("status").textContent = "Online";
        } catch (error) {
            console.error("Could not send message:", error);
            document.getElementById("status").textContent =
                "Your message could not be sent. Please check your connection and try again.";
        } finally {
            sendButton.disabled = false;
        }

    }


    // ==========================================
    // REALTIME
    // ==========================================

    function setupRealtime() {

        supabaseClient
            .channel("chat-room")

            .on(
                "postgres_changes",

                {
                    event: "INSERT",

                    schema: "public",

                    table: "messages"
                },

                async (payload) => {

                    await displayMessage(
                        payload.new
                    );

                    scrollToBottom();

                }

            )

            .subscribe();

    }


    // ==========================================
    // SCROLL TO BOTTOM
    // ==========================================

    function scrollToBottom() {

        const messages =
            document.getElementById("messages");


        messages.scrollTop =
            messages.scrollHeight;

    }


    // ==========================================
    // SEND BUTTON
    // ==========================================

    document
        .getElementById("sendButton")
        .addEventListener(
            "click",
            sendMessage
        );


    // ==========================================
    // ENTER KEY
    // ==========================================

    document
        .getElementById("messageInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter" && !event.isComposing) {
                    if (!event.shiftKey) {
                        event.preventDefault();
                        sendMessage();
                    }

                }

            }
        );


    // ==========================================
    // START
    // ==========================================

    async function startChat() {

        const loggedIn =
            await getCurrentUser();


        if (!loggedIn) {
            return;
        }


        try {
            await loadMessages();
            setupRealtime();
        } catch (error) {
            console.error("Could not start chat:", error);
            document.getElementById("status").textContent =
                "Chat could not be loaded. Please refresh and try again.";
        }

    }


    startChat();

</script>

</body>
</html>
