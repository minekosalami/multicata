<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Cata: Characters</title>
    <link rel="stylesheet" type="text/css" href="../characters.css">
</head>
<body>
    
    <h1>Characters - MultiCata</h1>

    <div class="character-buttons">
        <button onclick="showCharacter('Nart')">Nart</button>
        <button onclick="showCharacter('Amanda')">Amanda</button>
    </div>

      <div id="character-info">
        <h2>Select a character TO VIEW THEIR EVIL BACKSTORY.</h2>
    </div>

    <script>
        function showCharacter(character) {

            const info = document.getElementById("character-info");

            if (character === "Nart") {
                info.innerHTML = `
                    <h2>Nart</h2>
                    <img src="nart.jpeg" width="450">

                    <h3>Information</h3>
                    <p>Our beautiful mascot. You love him.</p>
                `;
            }

            else if (character === "Amanda") {
                info.innerHTML = `
                    <h2>Amanda</h2>
                    <img src="../amanda.jpg" width="250">

                    <h3>Information</h3>
                    <p>Amanda Accord. Born in Nebraska, Amanda died young when she was immolated by an unknown man in a cloak. After death she made it into Wonderland where the One Beyond All gave her an ultimatum. Die, or become one with the light. Amanda chose the light and was taken to the temple. The temple infused Amanda with the ability of super human luck. Amanda’s first mission was to murder 5 sinners who had disobeyed the One Beyond All, in which she succeeded.

Amanda stays in the temple between missions, waiting for the phone to ring.

Every time Amanda is reborn she takes place of the body of her Demon’s choosing.
Most often it is her old body, or the body of Ambellina. Other times it is someone completely different.

Amanda’s Demon is the Moon-Lord.
</p>
                `;
            }
        }
    </script>


</body>
</html>
