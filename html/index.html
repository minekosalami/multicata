    <h1>Multi-Cata Content:</h1>

    <p>

    </p>


    <script>

        // Your Supabase information
        const SUPABASE_URL = "https://ncmizvdipzjwiknslohn.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_l2Bi2NHypj5wHzOqE2U_nw_CFXaF1T-";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


        async function updateAccountButton() {

            const {
                data: { user }
            } = await supabaseClient.auth.getUser();


            const accountButton =
                document.getElementById("accountButton");


            // Not logged in
            if (!user) {

                accountButton.textContent = "Account";

                return;

            }


            // Logged in — get their profile
            const { data: profile, error } =
                await supabaseClient
                    .from("profiles")
                    .select("username")
                    .eq("user_id", user.id)
                    .maybeSingle();


            if (error) {

                console.error(
                    "Error loading profile:",
                    error
                );

                accountButton.textContent = "Account";

                return;

            }


            // Show username if they have one
            if (profile && profile.username) {

                accountButton.textContent =
                    "@" + profile.username;

            } else {

                accountButton.textContent =
                    "Account";

            }

        }


        updateAccountButton();

    </script>

</body>
