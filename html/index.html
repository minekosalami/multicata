    <script>

        // Your Supabase information
        const SUPABASE_URL = "https://ncmizvdipzjwiknslohn.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_l2Bi2NHypj5wHzOqE2U_nw_CFXaF1T-";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


        async function updateAccountButton() {

            const accountButton =
                document.getElementById("accountButton");

            try {
                const {
                    data: { user },
                    error: authError
                } = await supabaseClient.auth.getUser();

                if (authError) {
                    throw authError;
                }

                if (!user) {
                    accountButton.textContent = "Sign In";
                    return;
                }

                const { data: profile, error } = await supabaseClient
                    .from("profiles")
                    .select("username")
                    .eq("user_id", user.id)
                    .maybeSingle();

                if (error) {
                    throw error;
                }

                accountButton.textContent =
                    profile && profile.username ? "@" + profile.username : "Account";
            } catch (error) {
                if ((error.message || "").toLowerCase().includes("auth session missing")) {
                    accountButton.textContent = "Sign In";
                    return;
                }
                console.error("Could not update account navigation:", error);
                accountButton.textContent = "Account";
            }

        }


        updateAccountButton();

    </script>

    <script>
(function () {
    let typedKeys = "";

    document.addEventListener("keydown", function (event) {
        // Don't trigger while typing in text fields
        const target = event.target;

        if (
            target.tagName === "INPUT" ||
            target.tagName === "TEXTAREA" ||
            target.isContentEditable ||
            target.closest('[contenteditable="true"]')
        ) {
            return;
        }

        // Only track normal single-character keys
        if (event.key.length !== 1) {
            return;
        }

        typedKeys += event.key;
        typedKeys = typedKeys.slice(-4);

        // Secret phrase: Hell
        if (typedKeys.toLowerCase() === "hell") {
            window.location.href = "../secrets/hell.html";
        }
    });
})();
