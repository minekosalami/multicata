<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiCata - Account</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
            padding: 40px;
        }

        input {
            display: block;
            width: 280px;
            padding: 12px;
            margin: 10px auto;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        #accountArea,
        #profileArea {
            display: none;
        }

        .message {
            margin: 15px;
        }
    </style>
</head>

<body>

    <h1>MultiCata Account</h1>

    <!-- LOGIN / SIGNUP -->
    <div id="authArea">

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="signUp()">Create Account</button>
        <button onclick="logIn()">Log In</button>

        <p id="message" class="message"></p>

    </div>


    <!-- LOGGED IN ACCOUNT -->
    <div id="accountArea">

        <h2>You're logged in!</h2>

        <p id="userEmail"></p>

        <button onclick="showProfileSetup()">
            Set Up Profile
        </button>

        <button onclick="logOut()">
            Log Out
        </button>

    </div>


    <!-- PROFILE SETUP -->
    <div id="profileArea">

        <h2>Set Up Your Profile</h2>

        <input
            type="text"
            id="username"
            placeholder="Username"
            maxlength="20"
        >

        <input
            type="text"
            id="displayName"
            placeholder="Display Name"
            maxlength="40"
        >

        <textarea
            id="bio"
            placeholder="Bio"
            maxlength="200"
            style="
                display:block;
                width:280px;
                height:100px;
                padding:12px;
                margin:10px auto;
                border-radius:8px;
                border:none;
                font-size:16px;
                resize:none;
            "
        ></textarea>

        <button onclick="saveProfile()">
            Save Profile
        </button>

        <p id="profileMessage" class="message"></p>

    </div>


<script>

    // =========================
    // SUPABASE
    // =========================

    const SUPABASE_URL = "https://ncmizvdipzjwiknslohn.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_l2Bi2NHypj5wHzOqE2U_nw_CFXaF1T-";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


    // =========================
    // SIGN UP
    // =========================

    async function signUp() {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {
                    emailRedirectTo:
                        "https://multicata.com/account.html"
                }

            });


        if (error) {

            document.getElementById("message").textContent =
                error.message;

            return;

        }


        document.getElementById("message").textContent =
            "Account created! Check your email to verify it.";

    }


    // =========================
    // LOG IN
    // =========================

    async function logIn() {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        const { data, error } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            document.getElementById("message").textContent =
                error.message;

            return;

        }


        showLoggedInUser(data.user);

    }


    // =========================
    // LOG OUT
    // =========================

    async function logOut() {

        await supabaseClient.auth.signOut();

        document.getElementById("authArea").style.display = "block";

        document.getElementById("accountArea").style.display = "none";

        document.getElementById("profileArea").style.display = "none";

    }


    // =========================
    // SHOW LOGGED-IN USER
    // =========================

    async function showLoggedInUser(user) {

        if (!user) return;


        document.getElementById("authArea").style.display = "none";

        document.getElementById("accountArea").style.display = "block";

        document.getElementById("profileArea").style.display = "none";


        document.getElementById("userEmail").textContent =
            user.email;


        await ensureProfile(user);

    }


    // =========================
    // CREATE PROFILE IF NEEDED
    // =========================

    async function ensureProfile(user) {

        const { data: profile, error: fetchError } =
            await supabaseClient
                .from("profiles")
                .select("id, username, display_name, bio")
                .eq("user_id", user.id)
                .maybeSingle();


        if (fetchError) {

            console.error(
                "Error checking profile:",
                fetchError
            );

            return;

        }


        if (profile) {

            // Fill in existing profile information

            document.getElementById("username").value =
                profile.username || "";

            document.getElementById("displayName").value =
                profile.display_name || "";

            document.getElementById("bio").value =
                profile.bio || "";

            return;

        }


        // Create a blank profile

        const { error: insertError } =
            await supabaseClient
                .from("profiles")
                .insert({

                    user_id: user.id

                });


        if (insertError) {

            console.error(
                "Error creating profile:",
                insertError
            );

            return;

        }

    }


    // =========================
    // PROFILE SETUP
    // =========================

    function showProfileSetup() {

        document.getElementById("accountArea").style.display = "none";

        document.getElementById("profileArea").style.display = "block";

    }


    // =========================
    // SAVE PROFILE
    // =========================

    async function saveProfile() {

        const username =
            document.getElementById("username").value.trim();

        const displayName =
            document.getElementById("displayName").value.trim();

        const bio =
            document.getElementById("bio").value.trim();


        const { data: { user } } =
            await supabaseClient.auth.getUser();


        if (!user) {

            document.getElementById("profileMessage").textContent =
                "You aren't logged in.";

            return;

        }


        if (!username) {

            document.getElementById("profileMessage").textContent =
                "Please choose a username.";

            return;

        }


        const { error } =
            await supabaseClient
                .from("profiles")
                .update({

                    username: username,

                    display_name: displayName || null,

                    bio: bio || null

                })
                .eq("user_id", user.id);


        if (error) {

            if (
                error.message.toLowerCase().includes("duplicate") ||
                error.message.toLowerCase().includes("unique")
            ) {

                document.getElementById("profileMessage").textContent =
                    "That username is already taken.";

            } else {

                document.getElementById("profileMessage").textContent =
                    error.message;

            }

            console.error(error);

            return;

        }


        document.getElementById("profileMessage").textContent =
            "Profile saved! 🎉";

    }


    // =========================
    // CHECK LOGIN ON PAGE LOAD
    // =========================

    async function checkUser() {

        const {
            data: { user }
        } = await supabaseClient.auth.getUser();


        if (user) {

            showLoggedInUser(user);

        }

    }


    // =========================
    // AUTH STATE CHANGES
    // =========================

    supabaseClient.auth.onAuthStateChange(
        (event, session) => {

            if (session && session.user) {

                showLoggedInUser(session.user);

            }

        }
    );


    checkUser();

</script>

</body>
</html>
